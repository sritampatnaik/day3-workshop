name: llm-multiroute-ci

on:
  push:
    branches: [main]
    paths:
      - "llm-multiroute/**"
      - ".github/workflows/llm-multiroute-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build, scan, and push API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: sritampatnaik
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./llm-multiroute
          file: ./llm-multiroute/Dockerfile
          load: true
          push: false
          tags: sritampatnaik/llm-multiroute:1.0.0

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sritampatnaik/llm-multiroute:1.0.0
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: ./llm-multiroute
          file: ./llm-multiroute/Dockerfile
          push: true
          tags: |
            sritampatnaik/llm-multiroute:1.0.0
            sritampatnaik/llm-multiroute:latest
